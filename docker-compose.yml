
networks:
  mynetwork:
    driver: bridge

services:
  mongo:
    image: mongo:latest
    restart: always
    container_name: mongo
    env_file:
      - mongodb.env
    environment:
      TZ: America/Sao_Paulo
    ports:
      - "5017:27017"
    volumes:
      - ./data/db:/data/db
    networks:
      - mynetwork

  mongo-express:
    image: mongo-express:latest
    restart: always
    container_name: mongo-express
    env_file:
      - mongo-express.env
    ports:
      - "5081:8081"
    depends_on:
      - mongo
    networks:
      - mynetwork
    links:
      - mongo